<meta charset="UTF-8">

<title>Luminosity Beach Festival 2026 · Schedule</title>
<style>
:root {
  --bg: #07070f;
  --surface: #101020;
  --surface2: #18182c;
  --surface3: #20203a;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --border3: rgba(255,255,255,0.22);
  --text: #eeeef8;
  --text2: #8888a8;
  --text3: #4a4a68;
  --accent: #7F77DD;
  --accent-dim: rgba(127,119,221,0.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

/* ── HEADER ── */
.header {
  padding: 20px 24px 0;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 50;
  border-bottom: 1px solid var(--border);
}
.header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 14px;
}
.title-block .eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 2px;
}
.title-block h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  white-space: nowrap;
  user-select: none;
}
.btn:hover { background: var(--surface2); color: var(--text); border-color: var(--border3); }
.btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.saved-active { background: rgba(220, 80, 100, 0.2); border-color: rgba(220,80,100,0.4); color: #f88; }
.btn svg { flex-shrink: 0; }

/* ── DAY TABS ── */
.day-tabs {
  display: flex;
  gap: 2px;
  background: var(--surface);
  border-radius: 8px;
  padding: 3px;
  border: 1px solid var(--border);
  margin-bottom: 12px;
  width: fit-content;
}
.day-tab {
  padding: 6px 16px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.day-tab .date { font-size: 10px; display: block; opacity: 0.6; }
.day-tab.active { background: var(--accent); color: #fff; }
.day-tab:hover:not(.active) { color: var(--text); }

/* ── STAGE FILTERS ── */
.stage-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 10px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.stage-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px 4px 8px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.12s;
}
.stage-pill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.stage-pill.active { color: var(--text); background: var(--surface2); border-color: var(--border3); }
.stage-pill.off { opacity: 0.35; }

/* ── TIMELINE ── */
.main { padding: 14px 0 40px; }
.timeline-outer { display: flex; }
.labels-col {
  flex-shrink: 0;
  width: 110px;
  padding-left: 24px;
}
@media (max-width: 500px) {
  .labels-col { width: 80px; padding-left: 12px; }
}
.tracks-scroll {
  flex: 1;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-right: 24px;
  /* hide scrollbar on mobile but keep functionality */
  scrollbar-width: thin;
  scrollbar-color: var(--surface3) transparent;
}
.tracks-scroll::-webkit-scrollbar { height: 4px; }
.tracks-scroll::-webkit-scrollbar-track { background: transparent; }
.tracks-scroll::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }
.set-block {
  position: absolute;
  top: 3px; bottom: 3px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  padding: 0 7px;
  border: 1px solid transparent;
  cursor: pointer;
  overflow: hidden;
  transition: filter 0.12s, transform 0.1s;
  z-index: 1;
  min-width: 4px;
}
.set-block:hover { filter: brightness(1.3); z-index: 20; transform: scaleY(1.06); }
.set-block.saved {
  border: 2px solid rgba(255,255,255,0.75) !important;
  filter: brightness(1.5) saturate(1.2);
  box-shadow: 0 0 8px rgba(255,255,255,0.12);
}
.set-block.saved:hover { filter: brightness(1.8) saturate(1.3); }
.set-block.dimmed { opacity: 0.12; pointer-events: none; }
.artist-label {
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  flex: 1;
}
.saved-heart {
  flex-shrink: 0;
  font-size: 10px;
  margin-left: 3px;
  pointer-events: none;
  line-height: 1;
}


/* ── SAVED PANEL ── */
.saved-panel {
  margin-top: 16px;
  padding: 16px 18px;
  background: var(--surface);
  border-radius: 12px;
  border: 1px solid var(--border2);
  display: none;
}
.saved-panel.open { display: block; }
.saved-panel-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.saved-day-header {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  margin: 10px 0 5px;
}
.saved-day-header:first-child { margin-top: 0; }
.saved-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  border-radius: 6px;
  background: var(--surface2);
  margin-bottom: 3px;
  gap: 8px;
}
.saved-row .sname { font-weight: 600; font-size: 13px; color: var(--text); }
.saved-row .smeta { font-size: 11px; color: var(--text2); white-space: nowrap; }
.conflict-tag {
  font-size: 10px;
  background: rgba(220, 80, 48, 0.2);
  color: #f09070;
  border-radius: 4px;
  padding: 2px 7px;
  flex-shrink: 0;
}



/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 3px; }
</style>

  {day:'Sunday',stage:'This Is Trance!',artist:'Enigma State',start:[15,45],end:[17,0]},
  {day:'Sunday',stage:'This Is Trance!',artist:'Sophie Sugar',start:[17,0],end:[18,0]},
  {day:'Sunday',stage:'This Is Trance!',artist:'Allen Watts',start:[18,0],end:[19,0]},
  {day:'Sunday',stage:'This Is Trance!',artist:'Will Rees',start:[19,0],end:[20,0]},
  {day:'Sunday',stage:'This Is Trance!',artist:'Edele Andaya',start:[20,0],end:[21,0]},
  {day:'Sunday',stage:'This Is Trance!',artist:'Craig Connelly vinyl set',start:[21,0],end:[22,0]},
  {day:'Sunday',stage:'This Is Trance!',artist:'Agnelli & Nelson',start:[22,0],end:[23,0]},
];
// __DATA_END__

const DAYS = ['Thursday','Friday','Saturday','Sunday'];
const DAY_DATES = { Thursday: '25 Jun', Friday: '26 Jun', Saturday: '27 Jun', Sunday: '28 Jun' };
const STAGES = ['Mainstage Beach','Sunset Stage','Beachclub Bernies','This Is Trance!'];
const STAGE_CFG = {
  'Mainstage Beach':   { color: '#8F87E8', bg: 'rgba(127,119,221,0.25)', text: '#ccc8f8' },
  'Sunset Stage':      { color: '#1DB880', bg: 'rgba(29,158,117,0.25)', text: '#7ee8c0' },
  'Beachclub Bernies': { color: '#CCA030', bg: 'rgba(186,117,23,0.25)', text: '#ffd080' },
  'This Is Trance!':   { color: '#5090EE', bg: 'rgba(55,138,221,0.25)', text: '#90c8ff' },
};
const MIN_H = 12, MAX_H = 23;
const PX_PER_HOUR = 82;
const TOTAL_W = (MAX_H - MIN_H) * PX_PER_HOUR;
const AXIS_H = 20;
const TRACK_H = 40;
const ROW_GAP = 7;

// ── STATE ──────────────────────────────────────────────────────────────────
let currentDay = 'Thursday';
let activeStages = new Set(STAGES);
let saved = new Set();
let showSaved = false;
let hasAutoScrolled = false;

// ── PERSISTENCE ───────────────────────────────────────────────────────────
function load() {
  try {
    const s = localStorage.getItem('lbf26_saved');
    if (s) saved = new Set(JSON.parse(s));
  } catch(e) {}
}
function persist() {
  try {
    localStorage.setItem('lbf26_saved', JSON.stringify([...saved]));
  } catch(e) {}
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function origKey(s) { return s.day + '|' + s.artist + '|' + s.stage; }
function dec(arr) { return arr[0] + arr[1] / 60; }
function fmt(arr) { return arr[0] + ':' + arr[1].toString().padStart(2, '0'); }
function pct(h) { return ((h - MIN_H) / (MAX_H - MIN_H)) * 100; }

// ── BUILD STATIC UI ───────────────────────────────────────────────────────
function buildDayTabs() {
  const c = document.getElementById('dayTabs');
  DAYS.forEach(d => {
    const b = document.createElement('button');
    b.className = 'day-tab';
    b.dataset.day = d;
    b.innerHTML = d + '<span class="date">' + DAY_DATES[d] + '</span>';
    b.onclick = () => { currentDay = d; render(); };
    c.appendChild(b);
  });
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  document.querySelectorAll('.day-tab').forEach(b =>
    b.classList.toggle('active', b.dataset.day === currentDay));
  const savedBtn = document.getElementById('savedBtn');
  savedBtn.querySelector('span').textContent = saved.size + ' saved';
  savedBtn.classList.toggle('saved-active', showSaved);
  buildStageFilters();
  renderTimeline();
  renderSavedPanel();
}

function buildStageFilters() {
  const c = document.getElementById('stageFilters');
  c.innerHTML = '';
  STAGES.forEach(s => {
    const cfg = STAGE_CFG[s];
    const on = activeStages.has(s);
    const pill = document.createElement('button');
    pill.className = 'stage-pill ' + (on ? 'active' : 'off');
    pill.innerHTML = `<span class="dot" style="background:${cfg.color}"></span>${s}`;
    pill.onclick = () => { on ? activeStages.delete(s) : activeStages.add(s); render(); };
    c.appendChild(pill);
  });
}

function renderTimeline() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';

  function timeToPx(arr) { return ((arr[0] - MIN_H) + arr[1] / 60) * PX_PER_HOUR; }

  const dayData = BASE_DATA.filter(s => s.day === currentDay);
  const visibleStages = STAGES.filter(s => activeStages.has(s) && dayData.some(d => d.stage === s));

  const outer = document.createElement('div');
  outer.className = 'timeline-outer';

  // ── Labels column ──────────────────────────────────────────────
  const labelsCol = document.createElement('div');
  labelsCol.className = 'labels-col';

  const spacer = document.createElement('div');
  spacer.style.height = (AXIS_H + ROW_GAP) + 'px';
  labelsCol.appendChild(spacer);

  visibleStages.forEach(stage => {
    const lbl = document.createElement('div');
    lbl.style.cssText = `height:${TRACK_H + ROW_GAP}px;display:flex;align-items:center;font-size:11px;color:var(--text2);padding-right:8px;line-height:1.3;`;
    lbl.textContent = stage;
    labelsCol.appendChild(lbl);
  });

  // ── Scrollable tracks area ─────────────────────────────────────
  const scroll = document.createElement('div');
  scroll.className = 'tracks-scroll';
  scroll.id = 'tracksScroll';

  const inner = document.createElement('div');
  inner.style.cssText = `width:${TOTAL_W}px;position:relative;`;

  // Time axis
  const ax = document.createElement('div');
  ax.style.cssText = `position:relative;height:${AXIS_H}px;margin-bottom:${ROW_GAP}px;`;
  for (let h = MIN_H; h <= MAX_H; h++) {
    const tick = document.createElement('div');
    tick.style.cssText = `position:absolute;left:${(h - MIN_H) * PX_PER_HOUR}px;transform:translateX(-50%);font-size:10px;color:var(--text3);white-space:nowrap;`;
    tick.textContent = h + ':00';
    ax.appendChild(tick);
  }
  inner.appendChild(ax);

  // Tracks
  visibleStages.forEach(stage => {
    const cfg = STAGE_CFG[stage];
    const sets = dayData.filter(s => s.stage === stage);

    const track = document.createElement('div');
    track.style.cssText = `position:relative;height:${TRACK_H}px;margin-bottom:${ROW_GAP}px;background:var(--surface);border-radius:8px;border:1px solid var(--border);`;

    // Grid lines
    for (let h = MIN_H; h <= MAX_H; h++) {
      const gl = document.createElement('div');
      gl.style.cssText = `position:absolute;top:0;bottom:0;left:${(h - MIN_H) * PX_PER_HOUR}px;width:1px;background:rgba(255,255,255,0.04);pointer-events:none;`;
      track.appendChild(gl);
    }

    sets.forEach(base => {
      const s = base;
      const k = origKey(base);
      const isSaved = saved.has(k);
      const dimmed = showSaved && !isSaved;

      const startPx = timeToPx(s.start);
      const blockW = Math.max(timeToPx(s.end) - startPx, 4);

      const block = document.createElement('div');
      block.className = 'set-block' + (isSaved ? ' saved' : '') + (dimmed ? ' dimmed' : '');
      block.style.cssText = `left:${startPx}px;width:${blockW}px;background:${cfg.bg};border-color:transparent;`;
      block.title = `${s.artist} · ${fmt(s.start)}–${fmt(s.end)}`;
      block.dataset.key = k;
      block.dataset.textColor = cfg.text;

      const nameEl = document.createElement('div');
      nameEl.className = 'artist-label';
      nameEl.style.color = cfg.text;
      nameEl.textContent = s.artist;
      block.appendChild(nameEl);

      if (isSaved) {
        const heart = document.createElement('div');
        heart.className = 'saved-heart';
        heart.textContent = '♥';
        heart.style.color = cfg.text;
        block.appendChild(heart);
      }

      block.onclick = () => saveToggle(k);
      track.appendChild(block);
    });

    inner.appendChild(track);
  });

  // ── Time marker ────────────────────────────────────────────────
  const markerPx = injectTimeMarker(inner);

  scroll.appendChild(inner);
  outer.appendChild(labelsCol);
  outer.appendChild(scroll);
  tl.appendChild(outer);

  // Auto-scroll to now on first load only
  if (markerPx !== null && !hasAutoScrolled) {
    hasAutoScrolled = true;
    requestAnimationFrame(() => {
      scroll.scrollLeft = Math.max(0, markerPx - scroll.clientWidth / 2);
    });
  }
}

function renderSavedPanel() {
  const panel = document.getElementById('savedPanel');
  const items = document.getElementById('savedItems');
  items.innerHTML = '';

  if (!showSaved) {
    panel.classList.remove('open');
    return;
  }
  panel.classList.add('open');

  if (saved.size === 0) {
    items.innerHTML = '<div style="font-size:13px;color:var(--text3);padding:4px 0;">No sets saved yet — tap any set on the timeline to save it.</div>';
    return;
  }

  const list = [...saved].map(k => {
    const base = BASE_DATA.find(s => origKey(s) === k);
    return base ? { k, s: base } : null;
  }).filter(Boolean);

  list.sort((a, b) => {
    const dd = DAYS.indexOf(a.s.day) - DAYS.indexOf(b.s.day);
    return dd !== 0 ? dd : dec(a.s.start) - dec(b.s.start);
  });

  let lastDay = '';
  list.forEach(({ k, s }) => {
    if (s.day !== lastDay) {
      const dh = document.createElement('div');
      dh.className = 'saved-day-header';
      dh.textContent = s.day + ' · ' + DAY_DATES[s.day];
      items.appendChild(dh);
      lastDay = s.day;
    }
    const conflict = checkConflict(k, s);
    const row = document.createElement('div');
    row.className = 'saved-row';
    row.innerHTML = `
      <div style="display:flex;align-items:center;gap:7px;overflow:hidden">
        <span class="sname" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.artist}</span>
        ${conflict ? '<span class="conflict-tag">⚠ conflict</span>' : ''}
      </div>
      <span class="smeta">${fmt(s.start)}–${fmt(s.end)} · ${s.stage}</span>`;
    items.appendChild(row);
  });
}

function checkConflict(myKey, mySet) {
  const ms = dec(mySet.start), me = dec(mySet.end);
  return [...saved].some(k => {
    if (k === myKey) return false;
    const base = BASE_DATA.find(s => origKey(s) === k);
    if (!base) return false;
    if (base.day !== mySet.day) return false;
    return ms < dec(base.end) && me > dec(base.start);
  });
}

// ── CONTROLS ──────────────────────────────────────────────────────────────
function saveToggle(k) {
  if (saved.has(k)) saved.delete(k);
  else saved.add(k);
  persist();

  // Update the clicked block in place — no timeline rebuild
  const block = document.querySelector(`.set-block[data-key="${k}"]`);
  if (block) {
    const isSaved = saved.has(k);
    block.classList.toggle('saved', isSaved);

    // Add or remove heart icon
    const existingHeart = block.querySelector('.saved-heart');
    if (isSaved && !existingHeart) {
      const heart = document.createElement('div');
      heart.className = 'saved-heart';
      heart.textContent = '♥';
      heart.style.color = block.dataset.textColor;
      block.appendChild(heart);
    } else if (!isSaved && existingHeart) {
      existingHeart.remove();
    }
  }

  // If filtering to saved-only, update dimmed state on all visible blocks
  if (showSaved) {
    document.querySelectorAll('.set-block[data-key]').forEach(b => {
      b.classList.toggle('dimmed', !saved.has(b.dataset.key));
    });
  }

  // Update saved button and panel — no timeline rebuild
  const savedBtn = document.getElementById('savedBtn');
  savedBtn.querySelector('span').textContent = saved.size + ' saved';
  renderSavedPanel();
}

function toggleSavedPanel() {
  showSaved = !showSaved;
  // Update dimmed state on all visible blocks without rebuilding timeline
  document.querySelectorAll('.set-block[data-key]').forEach(b => {
    b.classList.toggle('dimmed', showSaved && !saved.has(b.dataset.key));
  });
  const savedBtn = document.getElementById('savedBtn');
  savedBtn.querySelector('span').textContent = saved.size + ' saved';
  savedBtn.classList.toggle('saved-active', showSaved);
  renderSavedPanel();
}

// ── IMAGE EXPORT ──────────────────────────────────────────────────────────
function generateImage() {
  const savedList = [...saved].map(k => BASE_DATA.find(s => origKey(s) === k)).filter(Boolean);
  if (savedList.length === 0) {
    alert('Heart some sets first, then tap Export Schedule to download your image.');
    return;
  }

  const byDay = {};
  DAYS.forEach(d => byDay[d] = []);
  savedList.forEach(s => byDay[s.day].push(s));
  const activeDays = DAYS.filter(d => byDay[d].length > 0);

  // Layout
  const W = 1200, PAD = 56, LABEL_W = 164;
  const TRACK_W = W - PAD * 2 - LABEL_W;
  const PX_HR = TRACK_W / (MAX_H - MIN_H);
  const TRACK_H = 46, ROW_GAP = 7, AXIS_H = 24, DAY_GAP = 36, HEADER_H = 108;

  // Canvas colours — solid values for canvas rendering
  const COLORS = {
    'Mainstage Beach':   { fill: '#1e1b52', stroke: '#8F87E8', text: '#ccc8f8' },
    'Sunset Stage':      { fill: '#0b3d2a', stroke: '#1DB880', text: '#7ee8c0' },
    'Beachclub Bernies': { fill: '#3d2700', stroke: '#CCA030', text: '#ffd080' },
    'This Is Trance!':   { fill: '#0b2545', stroke: '#5090EE', text: '#90c8ff' },
  };

  // Measure canvas height
  let totalH = 50 + HEADER_H;
  activeDays.forEach(day => {
    const stages = STAGES.filter(st => byDay[day].some(s => s.stage === st));
    totalH += DAY_GAP + 28 + 10 + AXIS_H + ROW_GAP + stages.length * (TRACK_H + ROW_GAP);
  });
  totalH += 50;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = totalH;
  const ctx = canvas.getContext('2d');

  // Rounded rect helper
  function rr(x, y, w, h, r, fill, stroke, sw) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw || 1; ctx.stroke(); }
  }

  // Background
  ctx.fillStyle = '#07070f';
  ctx.fillRect(0, 0, W, totalH);

  // Header gradient
  const grad = ctx.createLinearGradient(0, 0, 0, 50 + HEADER_H);
  grad.addColorStop(0, 'rgba(127,119,221,0.14)');
  grad.addColorStop(1, 'rgba(127,119,221,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 50 + HEADER_H);

  // Header text
  const ty = 50;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#3a3a58';
  ctx.font = '700 11px system-ui,sans-serif';
  ctx.fillText('ZANDVOORT  ·  NETHERLANDS', PAD, ty);

  ctx.fillStyle = '#eeeef8';
  ctx.font = '700 40px system-ui,sans-serif';
  ctx.fillText('Luminosity Beach Festival 2026', PAD, ty + 50);

  ctx.fillStyle = '#7F77DD';
  ctx.font = '600 15px system-ui,sans-serif';
  ctx.fillText('MY SCHEDULE  ·  ' + saved.size + ' sets saved', PAD, ty + 78);

  ctx.fillStyle = '#3a3a58';
  ctx.font = '13px system-ui,sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('luminosity-events.nl', W - PAD, ty + 78);

  // Separator
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PAD, ty + HEADER_H - 8);
  ctx.lineTo(W - PAD, ty + HEADER_H - 8);
  ctx.stroke();

  // Draw each day
  let y = 50 + HEADER_H;
  const trackX = PAD + LABEL_W;

  activeDays.forEach(day => {
    const daySets = byDay[day];
    const stages = STAGES.filter(st => daySets.some(s => s.stage === st));

    y += DAY_GAP;

    // Day label
    ctx.fillStyle = '#eeeef8';
    ctx.font = '700 15px system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(day.toUpperCase() + '  ·  ' + DAY_DATES[day], PAD, y + 16);
    y += 28 + 10;

    // Time axis
    ctx.font = '11px system-ui,sans-serif';
    ctx.textAlign = 'center';
    for (let hr = MIN_H; hr <= MAX_H; hr++) {
      const tx = trackX + (hr - MIN_H) * PX_HR;
      ctx.fillStyle = '#3a3a58';
      ctx.fillText(hr + ':00', tx, y + 13);
    }
    y += AXIS_H + ROW_GAP;

    stages.forEach(stage => {
      const col = COLORS[stage];
      const stageSets = daySets.filter(s => s.stage === stage);

      // Stage label — wrap if needed
      ctx.fillStyle = '#5a5a80';
      ctx.font = '12px system-ui,sans-serif';
      ctx.textAlign = 'left';
      const words = stage.split(' ');
      let line = '', lineY = y + TRACK_H / 2 - (words.length > 2 ? 8 : 4);
      words.forEach((word, i) => {
        const test = line + word + ' ';
        if (ctx.measureText(test).width > LABEL_W - 10 && line) {
          ctx.fillText(line.trim(), PAD, lineY);
          line = word + ' '; lineY += 15;
        } else { line = test; }
        if (i === words.length - 1) ctx.fillText(line.trim(), PAD, lineY);
      });

      // Track background
      rr(trackX, y, TRACK_W, TRACK_H, 7, '#101020', 'rgba(255,255,255,0.06)', 1);

      // Hour grid lines
      for (let hr = MIN_H; hr <= MAX_H; hr++) {
        const gx = trackX + (hr - MIN_H) * PX_HR;
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + TRACK_H); ctx.stroke();
      }

      // Set blocks
      stageSets.forEach(s => {
        const bx = trackX + (dec(s.start) - MIN_H) * PX_HR;
        const bw = Math.max((dec(s.end) - dec(s.start)) * PX_HR - 2, 4);
        const by2 = y + 3, bh = TRACK_H - 6;

        rr(bx + 1, by2, bw - 2, bh, 5, col.fill, null);
        rr(bx + 1, by2, bw - 2, bh, 5, null, col.stroke, 1.5);
        // Saved highlight border
        rr(bx + 1, by2, bw - 2, bh, 5, null, 'rgba(255,255,255,0.35)', 1);

        // Artist name, clipped to block
        ctx.save();
        ctx.beginPath();
        ctx.rect(bx + 6, by2, bw - 12, bh);
        ctx.clip();
        ctx.fillStyle = col.text;
        ctx.font = '600 11px system-ui,sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(s.artist, bx + 8, by2 + bh / 2 + 4);
        ctx.restore();
      });

      y += TRACK_H + ROW_GAP;
    });
  });

  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'my-luminosity-2026-schedule.png';
    a.click();
    URL.revokeObjectURL(a.href);
  }, 'image/png');
}

// ── FESTIVAL TIME MARKER ──────────────────────────────────────────────────
const FESTIVAL_DATES = {
  '2026-06-25': 'Thursday',
  '2026-06-26': 'Friday',
  '2026-06-27': 'Saturday',
  '2026-06-28': 'Sunday',
};

function getFestivalNow() {
  try {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Amsterdam',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false,
    }).formatToParts(now);
    const get = t => parts.find(p => p.type === t).value;
    const dateStr = `${get('year')}-${get('month')}-${get('day')}`;
    const hour = parseInt(get('hour'), 10);
    const minute = parseInt(get('minute'), 10);
    const day = FESTIVAL_DATES[dateStr];
    if (!day) return null;                    // not a festival date
    if (hour < MIN_H || hour >= MAX_H) return null;  // outside festival hours
    return { day, hour, minute };
  } catch(e) { return null; }
}

// Injects the now-line into `inner`. Returns the marker's px position, or null if not applicable.
function injectTimeMarker(inner) {
  const now = getFestivalNow();
  if (!now || now.day !== currentDay) return null;

  const markerPx = (now.hour - MIN_H + now.minute / 60) * PX_PER_HOUR;
  const timeStr = `${now.hour}:${now.minute.toString().padStart(2, '0')}`;

  const line = document.createElement('div');
  line.id = 'time-marker';
  line.style.cssText = `position:absolute;top:0;bottom:0;left:${markerPx}px;width:2px;background:rgba(255,255,255,0.88);box-shadow:0 0 8px rgba(255,255,255,0.35),0 0 18px rgba(255,255,255,0.1);pointer-events:none;z-index:30;`;

  const pill = document.createElement('div');
  pill.style.cssText = `position:absolute;top:3px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.92);color:#07070f;font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap;letter-spacing:0.02em;`;
  pill.textContent = timeStr;
  line.appendChild(pill);

  inner.appendChild(line);
  return markerPx;
}

// Called every minute to reposition the marker without rebuilding the timeline.
function updateMarker() {
  const now = getFestivalNow();
  const existing = document.getElementById('time-marker');

  if (!now || now.day !== currentDay) {
    if (existing) existing.remove();
    return;
  }

  const markerPx = (now.hour - MIN_H + now.minute / 60) * PX_PER_HOUR;
  const timeStr = `${now.hour}:${now.minute.toString().padStart(2, '0')}`;

  if (existing) {
    existing.style.left = markerPx + 'px';
    const pill = existing.querySelector('div');
    if (pill) pill.textContent = timeStr;
  } else {
    // Timeline exists but marker was missing (e.g. user switched day and came back)
    const inner = document.querySelector('#tracksScroll > div');
    if (inner) injectTimeMarker(inner);
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────
load();

// Auto-switch to today's festival day if applicable
const todayFestival = getFestivalNow();
if (todayFestival) currentDay = todayFestival.day;

buildDayTabs();
render();

// Update the marker every minute
setInterval(updateMarker, 60000);

// Re-evaluate on tab focus in case the page was left open overnight
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') updateMarker();
});
</script>
